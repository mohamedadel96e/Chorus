<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chorus Saga Trace</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <style>
    :root {
      --md-sys-color-primary: #0b57d0;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #d3e3fd;
      --md-sys-color-on-primary-container: #041e49;
      --md-sys-color-secondary: #00639b;
      --md-sys-color-error: #b3261e;
      --md-sys-color-error-container: #f9dedc;
      --md-sys-color-on-error-container: #410e0b;
      --md-sys-color-background: #f8fafd;
      --md-sys-color-surface: #f8fafd;
      --md-sys-color-surface-container: #ffffff;
      --md-sys-color-on-surface: #1f1f1f;
      --md-sys-color-on-surface-variant: #444746;
      --md-sys-color-outline: #747775;
      --md-elevation-1: 0px 1px 2px 0px rgba(0, 0, 0, 0.3), 0px 1px 3px 1px rgba(0, 0, 0, 0.15);
      --md-elevation-2: 0px 1px 2px 0px rgba(0, 0, 0, 0.3), 0px 2px 6px 2px rgba(0, 0, 0, 0.15);
    }

    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background-color: var(--md-sys-color-background);
      color: var(--md-sys-color-on-surface);
      -webkit-font-smoothing: antialiased;
    }

    /* Top App Bar */
    .top-app-bar {
      background-color: var(--md-sys-color-surface-container);
      color: var(--md-sys-color-on-surface);
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 24px;
      box-shadow: var(--md-elevation-1);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .top-app-bar h1 {
      font-family: 'Google Sans', sans-serif;
      font-size: 22px;
      font-weight: 500;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .top-app-bar .material-symbols-outlined {
      color: var(--md-sys-color-primary);
      font-size: 28px;
    }

    /* Main Container */
    .main-content {
      max-width: 1000px;
      margin: 32px auto;
      padding: 0 24px;
    }

    /* Search Card */
    .search-card {
      background: var(--md-sys-color-surface-container);
      border-radius: 24px;
      padding: 24px;
      box-shadow: var(--md-elevation-1);
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 32px;
    }
    .search-title {
      font-family: 'Google Sans', sans-serif;
      font-size: 20px;
      margin: 0;
    }
    .search-desc {
      color: var(--md-sys-color-on-surface-variant);
      margin: 0;
      font-size: 14px;
    }
    .search-row {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .md-input {
      flex: 1;
      position: relative;
    }
    .md-input input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--md-sys-color-outline);
      border-radius: 4px;
      padding: 16px;
      font-size: 16px;
      font-family: 'Roboto', sans-serif;
      background: transparent;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .md-input input:focus {
      border-color: var(--md-sys-color-primary);
      box-shadow: inset 0 0 0 1px var(--md-sys-color-primary);
    }
    .md-button {
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border: none;
      border-radius: 100px;
      padding: 0 24px;
      height: 48px;
      font-family: 'Google Sans', sans-serif;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background-color 0.2s, box-shadow 0.2s;
      box-shadow: var(--md-elevation-1);
    }
    .md-button:hover {
      background-color: #0a4ebd;
      box-shadow: var(--md-elevation-2);
    }

    /* Error Message */
    .error-msg {
      display: none;
      background: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 24px;
      font-family: 'Google Sans', sans-serif;
    }

    /* Mermaid Card */
    .mermaid-card {
      background: var(--md-sys-color-surface-container);
      border-radius: 24px;
      padding: 24px;
      box-shadow: var(--md-elevation-1);
      margin-bottom: 32px;
      display: none;
      overflow-x: auto;
    }
    .card-header {
      font-family: 'Google Sans', sans-serif;
      font-size: 20px;
      margin: 0 0 24px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-header .material-symbols-outlined {
      color: var(--md-sys-color-primary);
    }

    /* Timeline */
    .timeline-card {
      background: transparent;
      display: none;
    }
    
    .timeline-item {
      display: flex;
      margin-bottom: 24px;
      position: relative;
    }
    .timeline-item::before {
      content: '';
      position: absolute;
      left: 23px;
      top: 40px;
      bottom: -32px;
      width: 2px;
      background: var(--md-sys-color-primary-container);
    }
    .timeline-item:last-child::before {
      display: none;
    }

    .timeline-icon {
      width: 48px;
      height: 48px;
      border-radius: 24px;
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-right: 24px;
      z-index: 1;
    }
    .timeline-item.compensation .timeline-icon {
      background: var(--md-sys-color-error-container);
      color: var(--md-sys-color-error);
    }

    .timeline-content {
      background: var(--md-sys-color-surface-container);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--md-elevation-1);
      flex: 1;
      overflow: hidden;
    }
    .timeline-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .event-name {
      font-family: 'Google Sans', sans-serif;
      font-size: 18px;
      font-weight: 500;
      color: var(--md-sys-color-primary);
    }
    .timeline-item.compensation .event-name {
      color: var(--md-sys-color-error);
    }
    .event-time {
      font-size: 13px;
      color: var(--md-sys-color-on-surface-variant);
    }
    
    .event-payload {
      background: #f1f3f4;
      border-radius: 8px;
      padding: 16px;
      margin: 0;
      font-family: 'Roboto Mono', monospace;
      font-size: 13px;
      color: var(--md-sys-color-on-surface);
      overflow-x: auto;
      border: 1px solid #e0e0e0;
    }
  </style>
</head>
<body>

  <header class="top-app-bar">
    <h1>
      <span class="material-symbols-outlined">timeline</span>
      Chorus Saga Trace
    </h1>
  </header>

  <main class="main-content">
    <div class="search-card">
      <h2 class="search-title">Trace an Order</h2>
      <p class="search-desc">Enter a valid Order ID UUID to visualize its complete saga lifecycle across all microservices.</p>
      <div class="search-row">
        <div class="md-input">
          <input type="text" id="orderId" placeholder="e.g. 123e4567-e89b-12d3-a456-426614174000" onkeypress="handleEnter(event)" />
        </div>
        <button class="md-button" onclick="fetchTrace()">
          <span class="material-symbols-outlined">search</span>
          Search
        </button>
      </div>
    </div>

    <div class="error-msg" id="error-view">
      Trace not found or order does not exist.
    </div>

    <div class="mermaid-card" id="mermaid-card">
      <h3 class="card-header">
        <span class="material-symbols-outlined">account_tree</span>
        Saga Sequence Diagram
      </h3>
      <div id="mermaid-view"></div>
    </div>

    <div class="timeline-card" id="timeline-card">
      <h3 class="card-header">
        <span class="material-symbols-outlined">list_alt</span>
        Event Log
      </h3>
      <div id="timeline-view"></div>
    </div>
  </main>

  <script>
    mermaid.initialize({ 
      startOnLoad: true, 
      theme: 'base',
      themeVariables: {
        primaryColor: '#d3e3fd',
        primaryTextColor: '#041e49',
        primaryBorderColor: '#0b57d0',
        lineColor: '#747775',
        secondaryColor: '#f9dedc',
        tertiaryColor: '#fff',
        noteBkgColor: '#f1f3f4',
        noteTextColor: '#1f1f1f',
        actorBkg: '#ffffff',
        actorBorder: '#0b57d0',
        actorTextColor: '#041e49',
        signalColor: '#1f1f1f',
        signalTextColor: '#1f1f1f'
      }
    });

    const isCompensation = (type) => type.includes('Failed') || type.includes('Released') || type.includes('Refunded') || type.includes('Cancelled');

    function getEventIcon(type) {
      if (type.includes('Order')) return 'shopping_cart';
      if (type.includes('Inventory')) return 'inventory_2';
      if (type.includes('Payment')) return 'payments';
      if (type.includes('Shipment')) return 'local_shipping';
      return 'bolt';
    }

    function handleEnter(e) {
      if (e.key === 'Enter') fetchTrace();
    }

    async function fetchTrace() {
      const orderId = document.getElementById('orderId').value.trim();
      if (!orderId) return;

      const errorView = document.getElementById('error-view');
      const mermaidCard = document.getElementById('mermaid-card');
      const timelineCard = document.getElementById('timeline-card');

      errorView.style.display = 'none';
      mermaidCard.style.display = 'none';
      timelineCard.style.display = 'none';

      try {
        const res = await fetch(`/api/orders/${orderId}/trace`);
        if (!res.ok) {
          errorView.style.display = 'block';
          return;
        }
        
        const events = await res.json();
        if (events.length === 0) {
          errorView.innerText = "No events found for this Order ID.";
          errorView.style.display = 'block';
          return;
        }

        renderTimeline(events);
        await renderMermaid(events);
        
        mermaidCard.style.display = 'block';
        timelineCard.style.display = 'block';
      } catch (err) {
        errorView.innerText = "Error fetching trace data.";
        errorView.style.display = 'block';
      }
    }

    function renderTimeline(events) {
      const html = events.map(e => {
        const compClass = isCompensation(e.eventType) ? 'compensation' : '';
        const icon = getEventIcon(e.eventType);
        let payloadFormatted = "";
        try {
          payloadFormatted = JSON.stringify(JSON.parse(e.payload), null, 2);
        } catch {
          payloadFormatted = e.payload;
        }
        
        return `
          <div class="timeline-item ${compClass}">
            <div class="timeline-icon">
              <span class="material-symbols-outlined">${icon}</span>
            </div>
            <div class="timeline-content">
              <div class="timeline-header">
                <div class="event-name">${e.eventType}</div>
                <div class="event-time">${new Date(e.occurredAt).toLocaleString()}</div>
              </div>
              <pre class="event-payload">${payloadFormatted}</pre>
            </div>
          </div>
        `;
      }).join('');
      document.getElementById('timeline-view').innerHTML = html;
    }

    async function renderMermaid(events) {
      let diagram = 'sequenceDiagram\n';
      diagram += 'autonumber\n';
      diagram += 'participant O as Order\nparticipant I as Inventory\nparticipant P as Payment\nparticipant S as Shipping\n';
      
      events.forEach(e => {
        let source = 'O', target = 'O';
        let arrow = '->>';
        
        if (e.eventType === 'OrderCreated') { source = 'O'; target = 'I'; }
        else if (e.eventType === 'InventoryReserved') { source = 'I'; target = 'P'; }
        else if (e.eventType === 'InventoryReservationFailed') { source = 'I'; target = 'O'; arrow = '-->>'; }
        else if (e.eventType === 'PaymentCharged') { source = 'P'; target = 'S'; }
        else if (e.eventType === 'PaymentFailed') { source = 'P'; target = 'I'; arrow = '-->>'; }
        else if (e.eventType === 'ShipmentCreated') { source = 'S'; target = 'O'; }
        else if (e.eventType === 'ShipmentFailed') { source = 'S'; target = 'P'; arrow = '-->>'; }
        else if (e.eventType === 'PaymentRefunded') { source = 'P'; target = 'I'; arrow = '-->>'; }
        else if (e.eventType === 'InventoryReleased') { source = 'I'; target = 'O'; arrow = '-->>'; }
        else if (e.eventType === 'OrderCompleted' || e.eventType === 'OrderCancelled') {
          source = 'O'; target = 'O'; 
        }
        
        diagram += `${source}${arrow}${target}: ${e.eventType}\n`;
      });

      const container = document.getElementById('mermaid-view');
      container.removeAttribute('data-processed');
      container.innerHTML = `<div class="mermaid">${diagram}</div>`;
      
      try {
        await mermaid.run({ querySelector: '.mermaid' });
      } catch (err) {
        console.error("Mermaid error:", err);
      }
    }
  </script>
</body>
</html>
